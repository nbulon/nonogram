server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript text/javascript text/css application/json image/svg+xml;

    # No Content-Security-Policy: the Kotlin/Wasm bundle needs eval-class
    # allowances and Firebase Auth loads from Google origins, so a CSP written
    # without measuring first breaks sign-in. No Cross-Origin-Opener-Policy
    # either - same-origin closes the Google sign-in popup.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # nginx only inherits add_header from the enclosing level when the current
    # level declares none of its own, so every location that sets Cache-Control
    # has to repeat the three above or it would serve them bare.

    # Content-hashed chunks change name on every rebuild, so they can be cached forever
    location ~* "^/[0-9a-f]{20}\.wasm$" {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else keeps a stable name across deploys
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
