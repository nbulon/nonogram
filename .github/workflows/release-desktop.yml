name: Release desktop

on:
  push:
    branches: [ main ]
    paths:
      - 'desktopApp/**'
      - 'shared/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/release-desktop.yml'
  workflow_dispatch:

concurrency:
  group: release-desktop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Computes the version, so tag, release title and installer's internal version cannot differ
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          base=$(grep -E '^nonogram\.version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          [ -n "$base" ] || { echo "nonogram.version missing from gradle.properties" >&2; exit 1; }
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "tag=desktop-v$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            format: msi
            asset: Nonogram-windows-x64.msi
          - os: ubuntu-latest
            format: deb
            asset: Nonogram-linux-x64.deb
    # GitHub-hosted: jpackage only ever produces the host OS's format, and both self-hosted runners are Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21 (Corretto)
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21
      # :androidApp and :shared's android target are configured even for a :desktopApp task
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Package (prod)
        shell: bash
        run: |
          ./gradlew :desktopApp:packageReleaseDistributionForCurrentOS \
            -Pnonogram.env=prod \
            -Pnonogram.versionPatch=${{ github.run_number }}

      # Version-less names are the contract the web download button's permanent URL relies on
      - name: Rename to the stable asset name
        shell: bash
        run: |
          mkdir -p out
          cp desktopApp/build/compose/binaries/main-release/${{ matrix.format }}/*.${{ matrix.format }} \
             "out/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.format }}
          path: out/*
          retention-days: 7

  release:
    needs: [ build, version ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: out
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat > notes.md <<'NOTES'
          Nonogram for desktop, built from `main`.

          | File | Platform |
          |------|----------|
          | `Nonogram-windows-x64.msi` | Windows 10/11 (x64) |
          | `Nonogram-linux-x64.deb` | Debian/Ubuntu (x64) — `sudo apt install ./Nonogram-linux-x64.deb` |

          These builds are **not code-signed**. Windows SmartScreen will show
          "Windows protected your PC" on first run — click **More info → Run anyway**.
          NOTES

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" out/* \
              --repo "$REPO" \
              --title "Desktop $VERSION" \
              --notes-file notes.md \
              --latest
          fi
