name: Tests

on:
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: docker-self
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: android
            task: ':shared:testAndroidHostTest'
          - name: desktop
            task: ':shared:desktopTest'
          - name: js
            task: ':shared:jsBrowserTest'
          - name: wasmJs
            task: ':shared:wasmJsBrowserTest'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: false

      - name: Set up JDK 21 (Corretto)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: corretto
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-disabled: true

      - name: Run unit tests (${{ matrix.name }})
        env:
          # so karma's ChromeHeadless launcher finds chromium
          CHROME_BIN: /usr/bin/chromium
        run: ./gradlew ${{ matrix.task }} --profile

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports-${{ matrix.name }}
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
          retention-days: 7
