name: Tests

on:
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: docker-self
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: android
            task: ':shared:testAndroidHostTest'
          - name: desktop
            task: ':shared:desktopTest'
          - name: js
            task: ':shared:jsBrowserTest'
          - name: wasmJs
            task: ':shared:wasmJsBrowserTest'
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false

      - name: Set up JDK 21 (Corretto)
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Run unit tests (${{ matrix.name }})
        env:
          # so karma's ChromeHeadless launcher finds chromium
          CHROME_BIN: /usr/bin/chromium
        run: ./gradlew ${{ matrix.task }} --profile

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.name }}
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
          retention-days: 7
