name: Deploy web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: dev
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false

      - name: Set up JDK 21 (Corretto)
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Build web distributions (prod)
        run: ./gradlew :webApp:wasmJsBrowserDistribution :webApp:jsBrowserDistribution -Pnonogram.env=prod

      - name: Build image on the host and restart the container
        env:
          DOCKER_HOST: ssh://${{ vars.SSH_TARGET }}
          WEB_PORT: ${{ vars.WEB_PORT || '8080' }}
        run: |
          docker compose --project-name nonogram-web -f webApp/compose.yml up -d --build --remove-orphans
          docker image prune -f
