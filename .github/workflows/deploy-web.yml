name: Deploy web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: dev
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false

      - name: Set up JDK 21 (Corretto)
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Purge the previous distribution
        run: rm -rf webApp/build/dist

      # Two invocations so the compile JVM is gone before the native wasm-opt runs beside it
      - name: Compile wasmJs (prod)
        run: |
          echo 1000 > /proc/self/oom_score_adj
          ./gradlew :webApp:compileProductionExecutableKotlinWasmJs \
            -Pnonogram.env=prod \
            --no-daemon --no-parallel --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx1380m -XX:MaxMetaspaceSize=300m -XX:ReservedCodeCacheSize=128m -XX:+UseSerialGC -XX:MaxHeapFreeRatio=20 -XX:MinHeapFreeRatio=10 -Dfile.encoding=UTF-8" \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Optimize and bundle wasmJs distribution (prod)
        env:
          NODE_OPTIONS: --max-old-space-size=580
        run: |
          echo 1000 > /proc/self/oom_score_adj
          ./gradlew :webApp:wasmJsBrowserDistribution \
            -Pnonogram.env=prod \
            --no-daemon --no-parallel --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx640m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -Dfile.encoding=UTF-8"

      - name: Build image on the host and restart the container
        env:
          DOCKER_HOST: ssh://${{ vars.SSH_TARGET }}
          WEB_PORT: ${{ vars.WEB_PORT || '8080' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker compose --project-name nonogram-web -f webApp/compose.yml up -d --build --remove-orphans
          docker image prune -f
