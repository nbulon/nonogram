name: Deploy web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: dev
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false

      - name: Set up JDK 21 (Corretto)
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      # Overrides gradle.properties, so build stays a single low-priority JVM
      - name: Build web distributions (prod)
        env:
          NODE_OPTIONS: --max-old-space-size=580
        run: |
          nice -n 15 ./gradlew :webApp:wasmJsBrowserDistribution \
            -Pnonogram.env=prod \
            --no-daemon --no-parallel --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx1380m -XX:MaxMetaspaceSize=370m -XX:+UseSerialGC -XX:MaxHeapFreeRatio=20 -XX:MinHeapFreeRatio=10 -Dfile.encoding=UTF-8" \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Build image on the host and restart the container
        env:
          DOCKER_HOST: ssh://${{ vars.SSH_TARGET }}
          WEB_PORT: ${{ vars.WEB_PORT || '8080' }}
        run: |
          docker compose --project-name nonogram-web -f webApp/compose.yml up -d --build --remove-orphans
          docker image prune -f
